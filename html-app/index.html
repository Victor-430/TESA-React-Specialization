<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>React Foundation</title>
  </head>
  <body>
    <nav>
      <img src="Univaciti.png" alt="Univaciti logo" class="univaciti" />
    </nav>

    <main class="main-content">
      <div class="card">
        <div class="card-header">
          <h1>Registration Form</h1>
        </div>

        <form action="result.html" method="GET">
          <div class="form-group">
            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              required
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="role">Role:</label>
            <select id="role" name="role" required>
              <option value="" disabled selected>
                Select a role
              </option>
              <option value="Frontend Developer">Frontend Developer</option>
              <option value="Backend Developer">Backend Developer</option>
              <option value="Full Stack Developer">Full Stack Developer</option>
              <option value="UI/UX Designer">UI/UX Designer</option>
              <option value="Product Manager">Product Manager</option>
              <option value="Data Analyst">Data Analyst</option>
              <option value="Cloud Engineer">Cloud Engineer</option>
              <option value="AI / ML Engineer">AI / ML Engineer</option>
            </select>
          </div>

          <input type="submit" value="Submit" />
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 React Foundation.</p>
    </footer>
  </body>
</html>
